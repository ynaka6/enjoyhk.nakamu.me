<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4646"/>
      <stop offset="100%" stop-color="#e02020"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Bauhinia 5 petals -->
  <g transform="translate(16,15)" fill="#fff" opacity="0.95">
    <ellipse cx="0" cy="-5.5" rx="3.2" ry="6" transform="rotate(0)"/>
    <ellipse cx="0" cy="-5.5" rx="3.2" ry="6" transform="rotate(72)"/>
    <ellipse cx="0" cy="-5.5" rx="3.2" ry="6" transform="rotate(144)"/>
    <ellipse cx="0" cy="-5.5" rx="3.2" ry="6" transform="rotate(216)"/>
    <ellipse cx="0" cy="-5.5" rx="3.2" ry="6" transform="rotate(288)"/>
  </g>
  <!-- Petal veins -->
  <g transform="translate(16,15)" stroke="#e02020" stroke-width="0.5" fill="none" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="-8" transform="rotate(0)"/>
    <line x1="0" y1="0" x2="0" y2="-8" transform="rotate(72)"/>
    <line x1="0" y1="0" x2="0" y2="-8" transform="rotate(144)"/>
    <line x1="0" y1="0" x2="0" y2="-8" transform="rotate(216)"/>
    <line x1="0" y1="0" x2="0" y2="-8" transform="rotate(288)"/>
  </g>
  <!-- Center -->
  <circle cx="16" cy="15" r="1.8" fill="#fff"/>
  <circle cx="16" cy="15" r="0.8" fill="#e02020"/>
</svg>
